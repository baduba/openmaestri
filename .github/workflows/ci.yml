name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for the UI test
        run: npx playwright-core install --with-deps chromium
      - run: npm test
  deb:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: scripts/build-deb.sh
      - name: Smoke-test the package contents
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -x dist/*.deb /tmp/pkg
          node /tmp/pkg/usr/lib/openmaestri/bin/openmaestri.js version
          node -e "require('/tmp/pkg/usr/lib/openmaestri/node_modules/node-pty')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmaestri-deb
          path: dist/*.deb
